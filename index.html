<style>
 :root{

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit}

.hidden{display:none!important}

.wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,var(--hero1) 0,var(--bg) 48%)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}

.field{margin:14px 0}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
.input,.textarea,.select{width:100%;background:var(--panel3);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 12px;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent)}
.textarea{resize:vertical;min-height:86px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:10px 15px;font-weight:800;box-shadow:0 7px 18px rgba(24,119,242,.16)}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:9px 13px}
.danger{background:var(--danger);color:#fff;border:0;border-radius:11px;padding:9px 13px}
.icon{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1px solid var(--border);color:var(--text)}

.error{color:#ff8d98;font-size:13px;margin:9px 0}
.ok{color:var(--ok);font-size:13px;margin:9px 0}
.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow)}
.popup-stack{position:fixed;right:18px;top:78px;z-index:120;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px));pointer-events:none}.live-popup{pointer-events:auto;background:var(--panel);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:12px;display:flex;gap:10px;align-items:flex-start;animation:popupIn .18s ease-out}.live-popup.message{border-left:3px solid var(--accent)}.live-popup.notification{border-left:3px solid var(--ok)}.live-popup .close{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}.live-popup .popup-title{font-weight:800}.live-popup .popup-body{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}@keyframes popupIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.avatar.sm{width:34px;height:34px}.avatar.lg{width:80px;height:80px;border:4px solid var(--panel)}

 .composer textarea{min-height:76px}

.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.row{display:flex;gap:9px;align-items:center}.grow{flex:1;min-width:0}
.feed-tabs{display:flex;gap:5px;margin-bottom:11px}

.post-head{display:flex;align-items:center;gap:10px}
.post-user{font-weight:800}.post-time{font-size:11px;color:var(--muted)}
.post-body{white-space:pre-wrap;line-height:1.55;margin:12px 0}
.actions{display:flex;gap:5px;border-top:1px solid var(--border);padding-top:9px;margin-top:11px}
.actions button{background:transparent;color:var(--muted);border:0;padding:8px 10px;border-radius:9px}
.actions button:hover{background:var(--panel2);color:var(--text)}
.actions button.liked{color:#ff6675}
.comment{padding:8px 0;border-bottom:1px solid #20262d}.comment:last-child{border-bottom:0}
.comment-box{display:flex;gap:7px;margin-top:8px}.comment-box input{flex:1}
.list{display:grid;gap:9px}
.person{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--border);background:var(--panel2);border-radius:13px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;margin-left:4px}
.profile-card{overflow:hidden}.cover{height:150px;background:linear-gradient(135deg,#1a2740,#263a61)}
.profile-body{padding:0 16px 16px}.profile-info{display:flex;align-items:end;gap:13px;margin-top:-35px}.profile-actions{margin-left:auto}
.bio{line-height:1.5;color:var(--muted);margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}.stat b{font-size:19px;display:block}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100dvh - 132px);min-height:500px;max-height:calc(100dvh - 132px);overflow:hidden}
.chat-list{border-right:1px solid var(--border);overflow:auto}.chat-item{display:flex;gap:9px;padding:11px;cursor:pointer}.chat-item:hover,.chat-item.active{background:var(--panel2)}
.chat-main{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-width:0;min-height:0;height:100%;overflow:hidden}.chat-head{padding:13px 15px;border-bottom:1px solid var(--border)}.messages{overflow:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:75%;padding:9px 12px;border-radius:15px;background:var(--incoming);align-self:flex-start;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:var(--outgoing)}
.bubble small{display:block;opacity:.65;font-size:10px;margin-top:3px}.chat-media-preview{display:block;max-width:min(320px,72vw);max-height:360px;border-radius:12px;object-fit:cover;margin-bottom:6px;background:#000}.chat-video-preview{display:block;max-width:min(360px,74vw);max-height:360px;border-radius:12px;margin-bottom:6px;background:#000}.chat-attach{flex:none;width:42px;height:42px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);cursor:pointer}.chat-attach:hover{border-color:var(--accent)}.chat-uploading{opacity:.7;pointer-events:none}.chat-send{display:flex;gap:7px;padding:11px;border-top:1px solid var(--border);background:var(--panel);position:relative;z-index:2;flex:none}
.chat-meta{display:flex;align-items:center;gap:6px;margin-top:2px}
.chat-status{font-size:11px;color:var(--muted)}
.chat-search{max-width:190px}
.typing{font-size:11px;color:var(--ok);padding:5px 15px 6px;min-height:24px;line-height:14px;flex:none}
.bubble-wrap{display:flex;flex-direction:column;max-width:78%}.bubble-wrap.mine{align-self:flex-end;align-items:flex-end}
.bubble-tools{display:none;gap:3px;margin-top:3px}.bubble-wrap:hover .bubble-tools{display:flex}
.bubble-tools button{background:transparent;border:0;color:var(--muted);font-size:10px;padding:2px 4px}.bubble-tools button:hover{color:var(--text)}
.chat-head-actions{display:flex;gap:6px;align-items:center}
.chat-delete-btn{color:#ff8d98!important}

.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--topbar);backdrop-filter:blur(14px);border-top:1px solid var(--border);justify-content:space-around;padding:6px}.bottom button{border:0;background:transparent;color:var(--muted);padding:7px;font-size:11px}.bottom button.active{color:var(--accent)}
.mobile-more-menu{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.28);align-items:flex-end;justify-content:center;padding:0 12px 88px;}
.mobile-more-menu.open{display:flex;}
.mobile-more-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:0 -10px 35px rgba(0,0,0,.16);}
.mobile-more-card button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);padding:13px 12px;border-radius:12px;font-size:14px;text-align:left;}
.mobile-more-card button:hover{background:var(--panel2);}
.mobile-more-card button span{width:22px;height:22px;display:grid;place-items:center;}
.mobile-more-card svg{width:19px;height:19px;}
.mobile-more-card .mobile-more-logout{color:#e5484d;}
.bottom-more-dots{display:inline-flex;align-items:center;justify-content:center;height:22px;font-size:20px;line-height:18px;letter-spacing:1px;margin:0 auto 2px;}
@media(min-width:721px){.mobile-more-menu{display:none!important;}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:grid;place-items:center;padding:18px}.modal-card{width:min(580px,100%);max-height:90vh;overflow:auto;padding:18px;background:var(--panel);border:1px solid var(--border);border-radius:18px}.modal-head{display:flex;align-items:center;justify-content:space-between}
.notice{background:var(--panel3);border:1px solid var(--border);padding:11px 12px;border-radius:12px;color:var(--text);font-size:13px}

/* NEXORA Soft UI refresh */
.topbar{box-shadow:0 1px 0 var(--border),0 8px 30px rgba(0,0,0,.05)}
.logo{display:flex;align-items:center;gap:9px}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 7px 18px rgba(24,119,242,.20)}
.brand-mark svg{width:20px;height:20px;color:#fff}
.nav button,.bottom button{transition:background .16s ease,color .16s ease,transform .16s ease}
.nav button:hover,.bottom button:hover{transform:translateY(-1px)}
.nav-icon,.bottom-icon{width:20px;height:20px;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px}
.nav-icon svg,.bottom-icon svg{width:19px;height:19px}
.icon{transition:all .16s ease}
.icon:hover{border-color:var(--accent);transform:translateY(-1px);background:var(--panel2)}
.card,.sidebar-card,.user-mini,.person,.chat{box-shadow:0 5px 24px rgba(15,23,42,.045)}
body.light .card,body.light .sidebar-card,body.light .user-mini,body.light .person,body.light .chat{box-shadow:0 5px 24px rgba(15,23,42,.06)}
.search input,.input,.textarea,.select{background:var(--input)}
.chat-attach{background:var(--panel2)}
.theme-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:11px;color:var(--muted)}
.theme-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2)}
@media(max-width:720px){.bottom{background:var(--topbar);backdrop-filter:blur(16px);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:5px 6px;min-height:76px}.bottom button{color:var(--muted);min-width:0;padding:5px 2px;font-size:9px;line-height:1.1;white-space:normal}.bottom button.active{color:var(--accent)}.bottom-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 auto 2px}.bottom-icon svg{width:18px;height:18px}.bottom .badge{font-size:8px;padding:1px 4px}}

@media(max-width:720px){.chat{height:calc(100dvh - 112px);max-height:calc(100dvh - 112px);min-height:0}.topbar{height:58px;padding:0 11px}.topbar .search{display:none}.layout{display:block;padding:11px;padding-bottom:96px}.sidebar{display:none}.bottom{display:grid}.card{padding:14px}.profile-info{align-items:center}.profile-actions{margin-left:0}.grid2{grid-template-columns:1fr}.chat{grid-template-columns:1fr;height:calc(100vh - 91px);min-height:0}.chat-list{display:none}.stats{gap:6px}}

.safety-note{margin-top:8px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel3);font-size:11px;color:var(--muted)}

/* NEXORA custom delete confirmation UI */
.confirm-modal{position:fixed;inset:0;z-index:500;background:rgba(4,10,15,.58);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px}
.confirm-modal.open{display:flex;animation:confirmFade .16s ease-out}
.confirm-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28);transform:translateY(5px);animation:confirmUp .18s ease-out}
.confirm-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:rgba(228,30,63,.10);color:var(--danger);margin-bottom:14px}
.confirm-icon svg{width:24px;height:24px}

@keyframes confirmFade{from{opacity:0}to{opacity:1}}

<body>
<div id="root"></div>
<div id="confirmModal" class="confirm-modal" aria-hidden="true">
  <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-icon" id="confirmIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M9 6V4h6v2m-9 0 1 15h8l1-15M10 10v7m4-7v7"/></svg>
    </div>
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmText"></p>

</div>

<!-- NEXORA V23: automatic moderation uses deployed Edge Function slug quick-endpoint. -->
<script>
const SUPABASE_URL="https://hkhemrcqxfqjtyztvnsn.supabase.co";
const SUPABASE_KEY="sb_publishable_f9HL6I3QlcmnVy6Pdl62tA_jUili1MN";
const LOGIN_FN=SUPABASE_URL+"/functions/v1/login-with-username";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const initials=s=>(s||"?").slice(0,2).toUpperCase();
const fmt=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const uid=()=>window.__uid;
let currentPage="home", currentChat=null, searchTimer=null;

async function session(){const {data,error}=await sb.auth.getSession();if(error)throw error;return data.session}
async function profile(id=uid()){const {data,error}=await sb.from("profiles").select("*").eq("id",id).single();if(error)throw error;return data}
function avatar(p,extra=""){return `<div class="avatar ${extra}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(initials(p?.username||"NX"))}</div>`}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;$("#toastRoot").appendChild(e);setTimeout(()=>e.remove(),2400)}
function modal(html){$("#modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">${html}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
function setPage(p){if(p!=='messages'){closeChatRealtime().catch(()=>{});}currentPage=p;renderShell()}
function showErr(el,m){el.innerHTML=`<div class="error">${esc(m)}</div>`}
function timeAgo(iso){const sec=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(sec<60)return"now";if(sec<3600)return Math.floor(sec/60)+"m";if(sec<86400)return Math.floor(sec/3600)+"h";return Math.floor(sec/86400)+"d"}

function authUI(){
  $("#root").innerHTML=`<div class="wrap"><div class="card auth-card">
    <div class="logo">${brandLockup()}</div>
    <h1>Welcome to NEXORA</h1>
    <p class="muted">Username-based sign in for the real platform.</p>
    <div id="authBox"></div>
  </div></div>`;
  loginView();
}
function loginView(){
  $("#authBox").innerHTML=`<form onsubmit="login(event)">
   <div class="field"><label>Username</label><input class="input" id="loginUsername" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" required></div>
   <div class="field"><label>Password</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" required></div>

  </form><p class="muted">New here? <button class="link" onclick="registerView()">Create an account</button></p>

async function login(e){
  e.preventDefault();const out=$("#authMsg");
  try{
    const username=$("#loginUsername").value.trim(),password=$("#loginPassword").value;
    let r;
    try{
      r=await fetch(LOGIN_FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({username,password})});
    }catch(networkError){
      throw new Error("Username login service is not reachable. Deploy the login-with-username Edge Function first.");
    }
    let b={};
    try{ b=await r.json(); }catch(_e){}
    if(!r.ok)throw new Error(b.error||`Login service error (${r.status})`);
    const {error}=await sb.auth.setSession({access_token:b.access_token,refresh_token:b.refresh_token});if(error)throw error;
    await boot();
  }catch(err){showErr(out,err.message||"Login failed")}
}
async function register(e){
  e.preventDefault();const out=$("#authMsg");
  try{
    const username=$("#regUsername").value.trim(),email=$("#regEmail").value.trim(),password=$("#regPassword").value;
    const display=$("#regDisplay").value.trim()||username,bio=$("#regBio").value.trim();
    const {data:taken,error:check}=await sb.from("profiles").select("id").ilike("username",username).maybeSingle();
    if(check)throw check;
    if(taken)throw new Error("That username is already taken.");
    const {data,error}=await sb.auth.signUp({email,password,data:{username,display_name:display,bio}});if(error)throw error;
    if(!data.user){throw new Error("Account creation failed.");}
    if(!data.session){
      out.innerHTML=`<div class="ok">Account created. Sign in with your username and password.</div>`;
      setTimeout(loginView,1200);return;
    }

    // Create the public profile from the authenticated client.
    // This version intentionally does NOT depend on an auth.users trigger.
    const {error:profileError}=await sb.from("profiles").insert({
      id:data.user.id,
      username:username,
      display_name:display,
      bio:bio
    });
    if(profileError)throw profileError;

    const {error:settingsError}=await sb.from("user_settings").insert({
      user_id:data.user.id
    });
    if(settingsError && !/duplicate key|already exists/i.test(settingsError.message||"")){
      throw settingsError;
    }

    await boot();
  }catch(err){showErr(out,err.message||"Registration failed")}
}

function mediaExt(file){

}
function validatePostMedia(file){
  if(!file)return null;
  const allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];
  if(!allowed.includes(file.type))throw new Error('Please choose JPG, PNG, WebP, MP4 or WebM.');
  const max=file.type.startsWith('video/')?100*1024*1024:100*1024*1024;
  if(file.size>max)throw new Error('Media is too large. Maximum is 100 MB.');
  return file;
}

  if(error)throw error;
  const {error:dbError}=await sb.from('post_media').insert({post_id:postId,user_id:uid(),bucket:'post-media',path,media_type:file.type.startsWith('video/')?'video':'image',mime_type:file.type,size:file.size});
  if(dbError){try{await sb.storage.from('post-media').remove([path]);}catch(e){};throw dbError;}

async function hydratePostMedia(posts){
  const ids=(posts||[]).map(p=>p.id).filter(Boolean);
  if(!ids.length)return posts||[];
  const {data,error}=await sb.from('post_media').select('id,post_id,user_id,bucket,path,media_type,mime_type,size,created_at').in('post_id',ids).order('created_at',{ascending:true});
  if(error){console.warn('Post media metadata unavailable:',error.message);return posts||[];}
  const byPost=new Map();
  for(const row of (data||[])){if(!byPost.has(row.post_id))byPost.set(row.post_id,row);}
  for(const p of posts||[]){
    const row=byPost.get(p.id);
    if(row){
      const {data:urlData,error:urlError}=await sb.storage.from('post-media').createSignedUrl(row.path,60*60);
      if(!urlError&&urlData?.signedUrl)p.__media={...row,url:urlData.signedUrl};
    }
  }
  return posts||[];
}

function nexoraSafetyCheckText(text){

async function nexoraExtractVideoFrames(file){
  const MAX_FRAMES=12, MAX_DURATION=120, WIDTH=640, QUALITY=.68;
  if(!file?.type?.startsWith('video/'))return [];
  const url=URL.createObjectURL(file);
  const video=document.createElement('video');
  video.preload='metadata'; video.muted=true; video.playsInline=true; video.src=url;
  try{
    await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('Could not read video metadata.'));});
    const duration=Math.min(Number(video.duration)||0,MAX_DURATION);
    if(!duration)throw new Error('Video duration could not be read.');
    const count=Math.min(MAX_FRAMES,Math.max(4,Math.ceil(duration/10)));
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,WIDTH/(video.videoWidth||WIDTH));
    canvas.width=Math.max(1,Math.round((video.videoWidth||WIDTH)*scale));
    canvas.height=Math.max(1,Math.round((video.videoHeight||WIDTH*9/16)*scale));
    const ctx=canvas.getContext('2d',{alpha:false});
    const frames=[];
    for(let i=0;i<count;i++){
      const t=count===1?0:Math.min(duration-.05,(duration*(i+.5))/count);
      await new Promise((resolve,reject)=>{
        const done=()=>{video.onseeked=null;video.onerror=null;resolve()};
        video.onseeked=done; video.onerror=()=>{video.onseeked=null;reject(new Error('Could not read a video frame.'))};
        video.currentTime=Math.max(0,t);
      });
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      frames.push(canvas.toDataURL('image/jpeg',QUALITY));
    }
    return frames;
  }finally{URL.revokeObjectURL(url);video.remove();}
}

async function nexoraRunAutoModeration(postId,videoFrames=[]){
  const {data:{session},error:sessionError}=await sb.auth.getSession();
  if(sessionError)throw sessionError;
  if(!session?.access_token)throw new Error('Session expired. Please log in again.');
  const payload={post_id:postId};
  if(videoFrames?.length)payload.video_frames=videoFrames;
  const r=await fetch(SUPABASE_URL+'/functions/v1/quick-endpoint',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},
    body:JSON.stringify(payload)
  });
  let body={};try{body=await r.json()}catch(_){}
  if(!r.ok)throw new Error(body?.error||`Automatic safety check failed (${r.status}).`);
  return body;
}

async function publishPost({content,visibility,file,closeAfter=false,button=null}){
  content=(content||'').trim();
  if(!content&&!file){toast('Write something or add an image/video first');return false;}
  if(!nexoraSafetyCheckText(content).ok){toast('🛡️ This post was blocked by NEXORA Safety');return false;}
  if(file)validatePostMedia(file);
  if(button)button.disabled=true;
  let postId=null;
  try{
    const {data:post,error}=await sb.from('posts').insert({user_id:uid(),content,visibility,moderation_status:'pending'}).select('id').single();
    if(error)throw error;
    postId=post.id;
    let videoFrames=[];
    if(file){
      try{
        await uploadPostMediaToQuarantine(post.id,file);
        if(file.type.startsWith('video/')){
          toast('🎥 Preparing safety frames...');
          videoFrames=await nexoraExtractVideoFrames(file);
          if(!videoFrames.length)throw new Error('Could not prepare video safety frames.');
        }
      }catch(mediaError){try{await sb.from('posts').delete().eq('id',post.id)}catch(_){};throw mediaError}
    }
    const moderation=await nexoraRunAutoModeration(post.id,videoFrames);
    if(moderation?.status==='approved'){if(closeAfter)closeModal();toast('✓ Safety check passed. Your post is published.');}
    else if(moderation?.status==='rejected'){if(closeAfter)closeModal();toast('🛡️ NEXORA Safety rejected this post.');}
    else{if(closeAfter)closeModal();toast(file?.type?.startsWith('video/')?'🛡️ Video safety check is reviewing sampled frames...':'🛡️ Submitted for safety review. It remains hidden until approved.');}
    await pageRender();
    return true;
  }catch(err){
    if(postId){toast(`Post saved as pending. ${err.message||'Automatic safety check failed.'}`);try{await pageRender()}catch(_){};return false;}
    toast(err.message||'Post publishing failed');return false;
  }finally{if(button)button.disabled=false}
}

    setProfileSaveStatus('Please choose a JPG, PNG or WebP image.','error');
    return;

async function uploadProfileMedia(file,bucket,kind){
  if(!file) return null;
  const allowed=['image/jpeg','image/png','image/webp'];
  if(!allowed.includes(file.type)) throw new Error('Please choose a JPG, PNG or WebP image.');
  const max=bucket==='avatars'?5*1024*1024:10*1024*1024;
  if(file.size>max) throw new Error(`Image is too large. Maximum is ${bucket==='avatars'?5:10} MB.`);
  setProfileSaveStatus(`Uploading ${kind} image…`);
  const path=mediaPath(bucket,uid(),kind,file);
  const {error}=await sb.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});
  if(error) throw new Error(`Storage upload failed: ${error.message}`);
  setProfileSaveStatus(`${kind==='avatar'?'Profile':'Cover'} image uploaded. Saving profile…`);
  const {data:urlData,error:urlError}=await sb.storage.from(bucket).createSignedUrl(path,60*60*24*30);
  if(urlError) throw new Error(`Signed URL failed: ${urlError.message}`);
  if(!urlData?.signedUrl) throw new Error('Supabase did not return an image URL.');
  return {path,url:urlData.signedUrl};
}

async function hydrateChatMedia(messages){
  const list=Array.isArray(messages)?messages:[];
  await Promise.all(list.map(async m=>{
    m.__mediaUrl=null;
    if(!m.media_path || !m.media_bucket)return;
    try{
      const {data,error}=await sb.storage.from(m.media_bucket).createSignedUrl(m.media_path,3600);
      if(!error && data?.signedUrl)m.__mediaUrl=data.signedUrl;
    }catch(e){console.warn("Chat media URL failed",e)}
  }));
  return list;
}

function renderMessages(list,otherId){
  return list.map(m=>bubbleHTML(m,otherId)).join("");
}
function bubbleHTML(m,otherId){
  const mine=m.sender_id===uid();
  const read=mine && activeReadIds?.has?.(m.id);
  const edited=m.edited_at?" · edited":"";
  let body=esc(m.encrypted_content||"");
  if(m.message_type==="image" && m.__mediaUrl){
    body=`<img class="chat-media-preview" src="${esc(m.__mediaUrl)}" alt="Shared photo" loading="lazy" onclick="window.open(${JSON.stringify(m.__mediaUrl)},'_blank','noopener,noreferrer')">`+(body?`<div>${esc(m.encrypted_content||"")}</div>`:"");
  }else if(m.message_type==="video" && m.__mediaUrl){
    body=`<video class="chat-video-preview" controls preload="metadata"><source src="${esc(m.__mediaUrl)}" type="${esc(m.media_mime_type||"video/mp4")}"></video>`+(body?`<div>${esc(m.encrypted_content||"")}</div>`:"");
  }else if((m.message_type==="image"||m.message_type==="video") && !m.__mediaUrl){
    body=`<div class="small" style="opacity:.7">Media unavailable</div>`+(body?`<div>${esc(m.encrypted_content||"")}</div>`:"");
  }
  return `<div class="bubble-wrap ${mine?"mine":""}" id="msg_${m.id}">
    <div class="bubble ${mine?"mine":""}">${body}<small>${fmt(m.created_at)}${mine?` · ${read?"Read":"Sent"}`:""}${edited}</small></div>
    ${mine?`<div class="bubble-tools">${m.message_type==="text"?`<button onclick="editMessage('${m.id}')">Edit</button>`:""}<button onclick="deleteMessage('${m.id}')">Delete for everyone</button></div>`:""}
  </div>`;
}

const CHAT_MEDIA_MAX=50*1024*1024;
const CHAT_MEDIA_TYPES={
  "image/jpeg":"jpg",
  "image/png":"png",
  "image/webp":"webp",
  "video/mp4":"mp4",
  "video/webm":"webm"
};
function validateChatMedia(file){
  if(!file)return;
  if(!Object.prototype.hasOwnProperty.call(CHAT_MEDIA_TYPES,file.type))throw new Error("Please choose JPG, PNG, WebP, MP4 or WebM.");
  if(file.size<=0 || file.size>CHAT_MEDIA_MAX)throw new Error("Chat media must be between 1 byte and 50 MB.");
}
async function handleChatMediaPick(input){
  const file=input?.files?.[0];
  if(!file)return;
  input.value="";
  try{
    validateChatMedia(file);
    await sendChatMedia(file);
  }catch(err){toast(err?.message||"Could not send media.")}
}
async function sendChatMedia(file){
  if(!activeConversationId){throw new Error("Open a private chat first.");}
  const sendBar=$("#chatSendBar");
  const input=$("#msgInput");
  const caption=String(input?.value||"").trim();
  validateChatMedia(file);
  sendBar?.classList.add("chat-uploading");
  const ext=CHAT_MEDIA_TYPES[file.type];
  const path=`${activeConversationId}/${uid()}/${crypto.randomUUID()}.${ext}`;
  try{
    const {error:uploadError}=await sb.storage.from("chat-media").upload(path,file,{contentType:file.type,upsert:false,cacheControl:"3600"});
    if(uploadError)throw uploadError;
    const type=file.type.startsWith("video/")?"video":"image";
    const {data,error:dbError}=await sb.from("messages").insert({
      conversation_id:activeConversationId,
      sender_id:uid(),
      encrypted_content:caption,
      message_type:type,
      media_bucket:"chat-media",
      media_path:path,
      media_mime_type:file.type,
      media_size:file.size,
      media_url:null
    }).select("*").single();
    if(dbError){try{await sb.storage.from("chat-media").remove([path])}catch(_){};throw dbError}
    await hydrateChatMedia([data]);
    if(input){input.value="";await sendTyping("")}
    activeMessages.push(data);
    const list=$("#messageList");
    if(list){list.insertAdjacentHTML("beforeend",bubbleHTML(data,activeOtherId));list.scrollTop=list.scrollHeight}
  }finally{
    sendBar?.classList.remove("chat-uploading");
  }
}

let activeReadIds = new Set();

async function refreshReadState(){
  activeReadIds=new Set();
  const ids=activeMessages.map(m=>m.id).filter(Boolean);
  if(!ids.length||!activeOtherId)return;
  const {data}=await sb.from("message_reads").select("message_id").in("message_id",ids).eq("user_id",activeOtherId);
  (data||[]).forEach(x=>activeReadIds.add(x.message_id));
}

async function markMessagesRead(messages){
  const incoming=messages.filter(m=>m.sender_id!==uid());
  if(!incoming.length)return;
  const ids=incoming.map(m=>m.id);
  const {data:existing}=await sb.from("message_reads").select("message_id").in("message_id",ids).eq("user_id",uid());
  const done=new Set((existing||[]).map(x=>x.message_id));
  const missing=ids.filter(id=>!done.has(id));
  if(missing.length){
    const rows=missing.map(message_id=>({message_id,user_id:uid()}));
    const {error}=await sb.from("message_reads").insert(rows);
    if(error && !/duplicate key|already exists/i.test(error.message||""))console.warn(error.message);
    await refreshUnreadCounts();
    if(chatRealtimeChannel){
      try{await chatRealtimeChannel.send({type:"broadcast",event:"read",payload:{user_id:uid(),message_ids:missing}})}catch(e){}
    }
  }
}

function filterChat(q){

async function sendTyping(text){
  const ch=chatRealtimeChannel;
  if(!ch || !activeConversationId)return;
  const typing=!!String(text||"").trim();
  chatTypingState=typing;
  try{

    });

  }

async function subscribeToChatRealtime(conversationId,otherId){
  await closeChatRealtime();
  chatRealtimeChannel=sb.channel("nexora-chat-"+conversationId,{
    config:{
      broadcast:{ack:true,self:false},
      presence:{key:uid()}
    }
  });

  chatRealtimeChannel
    .on("postgres_changes",{
      event:"INSERT",schema:"public",table:"messages",
      filter:`conversation_id=eq.${conversationId}`
    },async payload=>{
      const m=payload.new;
      if(activeConversationId!==conversationId)return;
      if(!activeMessages.some(x=>x.id===m.id)){
        await hydrateChatMedia([m]);
        activeMessages.push(m);
        await refreshReadState();
        const list=$("#messageList");if(list){list.insertAdjacentHTML("beforeend",bubbleHTML(m,otherId));list.scrollTop=list.scrollHeight}
      }
      if(m.sender_id!==uid()){await markMessagesRead([m]);await refreshUnreadCounts();}
    })
    .on("postgres_changes",{
      event:"UPDATE",schema:"public",table:"messages",
      filter:`conversation_id=eq.${conversationId}`
    },async payload=>{
      const idx=activeMessages.findIndex(x=>x.id===payload.new.id);
      if(idx>=0){
        await hydrateChatMedia([payload.new]);
        activeMessages[idx]=payload.new;
        const old=$("#msg_"+payload.new.id);if(old)old.outerHTML=bubbleHTML(payload.new,otherId);
      }
    })
    .on("postgres_changes",{
      event:"DELETE",schema:"public",table:"messages",
      filter:`conversation_id=eq.${conversationId}`
    },payload=>{
      const id=payload.old?.id;
      activeMessages=activeMessages.filter(x=>x.id!==id);
      $("#msg_"+id)?.remove();
    })
    .on("broadcast",{event:"typing"},payload=>{
      const p=payload.payload||{};
      if(p.conversation_id===conversationId && p.user_id===otherId){
        $("#typingLine")?.classList.toggle("hidden",!p.typing);
      }
    })
    .on("broadcast",{event:"read"},async payload=>{
      if(payload.payload?.user_id===otherId){
        (payload.payload.message_ids||[]).forEach(x=>activeReadIds.add(x));
        activeMessages.forEach(m=>{
          if(payload.payload.message_ids?.includes(m.id)){
            const old=$("#msg_"+m.id);if(old)old.outerHTML=bubbleHTML(m,otherId);
          }
        });
      }
    })
    .on("presence",{event:"sync"},()=>{
      const state=chatRealtimeChannel?.presenceState?.()||{};
      const online=Object.values(state).flat().some(p=>p.user_id===otherId);
      const status=$("#presenceStatus");if(status)status.textContent=online?"Online":"Offline";
    })
    .on("presence",{event:"join",},()=>{
      const status=$("#presenceStatus");if(status)status.textContent="Online";
    })
    .on("presence",{event:"leave"},()=>{
      const status=$("#presenceStatus");if(status)status.textContent="Offline";
    })
    .subscribe(async status=>{
      if(status==="SUBSCRIBED"){
        try{
          await chatRealtimeChannel.track({user_id:uid(),online_at:new Date().toISOString()});
          const state=chatRealtimeChannel.presenceState()||{};
          const online=Object.values(state).flat().some(p=>p.user_id===otherId);
          const st=$("#presenceStatus");if(st)st.textContent=online?"Online":"Offline";
        }catch(e){}
      }
    });
}
async function sendChat(){
  const input=$("#msgInput");if(!input||!activeConversationId)return;
  const text=input.value.trim();if(!text)return;
  input.value="";await sendTyping("");$("#typingLine")?.classList.add("hidden");
  const {data,error}=await sb.from("messages").insert({
    conversation_id:activeConversationId,
    sender_id:uid(),
    encrypted_content:text,
    message_type:"text"
  }).select("*").single();
  if(error){toast(error.message);input.value=text;return}
  // Local optimistic render; realtime listener avoids duplicates.
  if(!activeMessages.some(x=>x.id===data.id)){
    activeMessages.push(data);
    const list=$("#messageList");if(list){list.insertAdjacentHTML("beforeend",bubbleHTML(data,activeOtherId));list.scrollTop=list.scrollHeight}
  }
}
async function editMessage(id){
  const m=activeMessages.find(x=>x.id===id);if(!m)return;
  const next=prompt("Edit message:",m.encrypted_content||"");if(next===null)return;
  const text=next.trim();if(!text)return;
  const {data,error}=await sb.from("messages").update({encrypted_content:text,edited_at:new Date().toISOString()}).eq("id",id).eq("sender_id",uid()).select("*").single();
  if(error)toast(error.message);else{
    const idx=activeMessages.findIndex(x=>x.id===id);if(idx>=0)activeMessages[idx]=data;
    const old=$("#msg_"+id);if(old)old.outerHTML=bubbleHTML(data,activeOtherId);
  }
}
async function deleteMessage(id){
  if(!await showDeleteConfirm("Delete this message?","This message will be permanently removed for everyone in this chat."))return;
  const m=activeMessages.find(x=>x.id===id);
  if(!m)return;
  if(m.media_bucket==="chat-media" && m.media_path){
    const {error:storageError}=await sb.storage.from("chat-media").remove([m.media_path]);
    if(storageError){toast("Media cleanup failed: "+storageError.message);return;}
  }
  const {error}=await sb.from("messages").delete().eq("id",id).eq("sender_id",uid());
  if(error){toast(error.message);return;}
  activeMessages=activeMessages.filter(x=>x.id!==id);$("#msg_"+id)?.remove();
}
async function deleteEntireChat(){
  if(!activeConversationId)return;
  if(!await showDeleteConfirm("Delete this entire chat?","All messages in this private conversation will be permanently deleted for both sides."))return;
  const conversationId=activeConversationId;
  const otherId=activeOtherId;
  const {error}=await sb.rpc("delete_private_conversation",{p_conversation_id:conversationId});
  if(error){toast(error.message);return}
  await closeChatRealtime();
  activeConversationId=null;
  activeOtherId=null;
  activeMessages=[];
  toast("Chat deleted for both sides");
  await messagesPage($("#main"));
}

async function deleteMyAccount(){

  try{
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session?.access_token)throw new Error('Session expired. Please log in again.');
    const r=await fetch(SUPABASE_URL+'/functions/v1/delete-account',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({})});
    let body={};try{body=await r.json()}catch(_){}
    if(!r.ok)throw new Error(body?.error||`Account deletion failed (${r.status}).`);
    await sb.auth.signOut();
    toast('Your NEXORA account has been deleted.');
    setTimeout(()=>location.reload(),700);
  }catch(err){toast(err.message||'Account deletion failed');}
}

}
function openSearchModal(){
  modal(`<div class="modal-head"><h2>Search NEXORA</h2><button class="secondary" onclick="closeModal()">×</button></div><input id="globalModalSearch" class="input" autofocus placeholder="Search usernames..." oninput="searchModal(this.value)"><div id="searchResults" class="list" style="margin-top:12px"></div>`);
}
async function searchModal(q){
  q=q.trim();if(!q){$("#searchResults").innerHTML='<div class="empty">Type a username to search.</div>';return}
  const {data}=await sb.from("profiles").select("*").ilike("username",`%${q}%`).neq("id",uid()).limit(10);
  $("#searchResults").innerHTML=(data||[]).map(u=>`<div class="person">${avatar(u,"sm")}<div class="grow"><b>@${esc(u.username)}</b><div class="small">${esc(u.display_name||"")}</div></div><button class="secondary" onclick="closeModal();currentPage='profile';renderShell();setTimeout(()=>profilePage($('#main'),'${u.id}'),50)">View</button></div>`).join("")||'<div class="empty">No users found.</div>';
}
function globalSearch(v){if(v.trim().length>1)openSearchModal()}
async function toggleTheme(){
  const next=document.body.classList.contains('light')?'dark':'light';
  setTheme(next);
  const b=document.getElementById('themeToggle'); if(b)b.innerHTML=iconSvg(next==='light'?'sun':'moon');
  try{
    const {error}=await sb.from('user_settings').upsert({user_id:uid(),theme:next,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
    toast(next==='light'?'Light theme enabled':'Dark theme enabled');
  }catch(e){toast('Theme saved locally for this session');}
}
let popupTimers=[];
function showLivePopup(kind,title,body,onClick){
  const stack=$("#popupStack");if(!stack)return;
  const el=document.createElement("div");el.className=`live-popup ${kind}`;el.innerHTML=`<div style="font-size:20px">${kind==="message"?"✉":"●"}</div><div class="grow"><div class="popup-title">${esc(title)}</div><div class="popup-body">${esc(body)}</div></div><button class="close" aria-label="Close">×</button>`;
  el.querySelector(".close").onclick=()=>el.remove();
  if(onClick)el.onclick=e=>{if(e.target.closest(".close"))return;onClick();el.remove()};
  stack.prepend(el);
  const timer=setTimeout(()=>el.remove(),6000);popupTimers.push(timer);
}
async function refreshUnreadCounts(){
  try{
    const [{count:notifCount},{count:msgCount}]=await Promise.all([
      sb.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",uid()).is("read_at",null).neq("type","new_message"),
      sb.rpc("get_nexora_unread_message_count")
    ]);
    window.__unreadNotifications=notifCount||0;
    window.__unreadMessages=Number(msgCount)||0;
    document.querySelectorAll(".nav button,.bottom button").forEach(b=>{
      const label=b.textContent||"";
      const badge=b.querySelector(".badge");
      if(label.includes("Notifications")){ if(window.__unreadNotifications){if(badge)badge.textContent=window.__unreadNotifications;else b.insertAdjacentHTML("beforeend",` <span class="badge">${window.__unreadNotifications}</span>`)}else if(badge)badge.remove(); }
      if(label.includes("Messages")){ if(window.__unreadMessages){if(badge)badge.textContent=window.__unreadMessages;else b.insertAdjacentHTML("beforeend",` <span class="badge">${window.__unreadMessages}</span>`)}else if(badge)badge.remove(); }
    });
  }catch(e){console.warn("Unread count refresh failed",e)}
}
async function markNotificationsRead(){
  const {error}=await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",uid()).is("read_at",null).neq("type","new_message");
  if(error)console.warn("Notification read update failed",error.message);
  window.__unreadNotifications=0;await refreshUnreadCounts();
}
async function showIncomingNotification(n){
  if(!n||n.user_id!==uid()||n.type==="new_message")return;
  if(n.read_at)return;
  const actor=window.__profileLookup[n.actor_id];
  showLivePopup("notification",`@${actor?.username||"Someone"}`,n.message||"You have a new notification.",()=>setPage("notifications"));
  window.__unreadNotifications=(window.__unreadNotifications||0)+1;await refreshUnreadCounts();
}
let realtimeChannel = null;
let realtimeRetryTimer = null;
let booting = false;
let livePageRefreshTimer = null;

function scheduleLivePageRefresh(){
  if(currentPage!=="home" && currentPage!=="profile")return;
  clearTimeout(livePageRefreshTimer);
  livePageRefreshTimer=setTimeout(()=>{
    pageRender().catch(e=>console.warn("Live page refresh failed:",e));
  },180);
}

async function refreshLiveLikeCount(pid){
  const el=document.querySelector(`[data-like-count="${pid}"]`);
  if(!el)return;
  const {count}=await sb.from("post_likes").select("post_id",{count:"exact",head:true}).eq("post_id",pid);
  if(el)el.textContent=count??0;
}

async function loadRealtime(){
  try{
    if(realtimeChannel){
      try{ await sb.removeChannel(realtimeChannel); }catch(e){}
      realtimeChannel = null;
    }

    realtimeChannel = sb.channel("nexora-live-" + uid());

    realtimeChannel
      // New/edited/deleted posts update the visible feed/profile automatically.
      .on("postgres_changes",{event:"*",schema:"public",table:"posts"},payload=>{
        // Do not rebuild the whole page while the user is typing in a composer.
        // A debounced refresh is still used when the composer is idle.
        if(currentPage==="home"||currentPage==="profile") scheduleLivePageRefresh();
      })
      // post_media is added to realtime below in the optional SQL step. If it is
      // not enabled yet, the post event still updates text-only posts live.
      .on("postgres_changes",{event:"*",schema:"public",table:"post_media"},()=>{
        scheduleLivePageRefresh();
      })
      // Likes update only the affected counter, so typing/comment boxes are not lost.
      .on("postgres_changes",{event:"*",schema:"public",table:"post_likes"},payload=>{
        const pid=payload.new?.post_id||payload.old?.post_id;
        if(pid)refreshLiveLikeCount(pid).catch(()=>{});
      })
      // Comments refresh an already-open comment section without refreshing the page.
      .on("postgres_changes",{event:"*",schema:"public",table:"comments"},payload=>{
        const pid=payload.new?.post_id||payload.old?.post_id;
        if(pid && document.getElementById("comments_"+pid)){
          loadComments(pid).catch(()=>{});
        }
      })
      // Friend requests update friend/notification screens and the sidebar badge.
      .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests"},async()=>{
        await loadRelationshipState();
        if(currentPage==="friends"||currentPage==="notifications") await pageRender();
        else{
          const badges=document.querySelectorAll(".badge");
          badges.forEach(b=>b.textContent=window.__pending||0);
        }
      })
      // Notifications are delivered live to the notifications page.
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications"},async payload=>{
        const n=payload.new;
        if(n?.user_id===uid() && n.type!=="new_message"){
          await showIncomingNotification(n);
          if(currentPage==="notifications")await pageRender();
        }
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"notifications"},async()=>{
        await refreshUnreadCounts();
      })
      // Keep the chat list fresh when messages/conversations change.
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
        const msg=payload.new;
        if(msg?.sender_id!==uid()){
          let actor=window.__profileLookup[msg.sender_id];
          if(!actor){const r=await sb.from("profiles").select("username,display_name").eq("id",msg.sender_id).maybeSingle();actor=r.data||{};}
          if(!(currentPage==="messages" && activeConversationId===msg.conversation_id)){
            showLivePopup("message",`New message from @${actor?.username||"user"}`,msg.encrypted_content||"New message",async()=>{
              const r=await sb.from("conversation_members").select("user_id").eq("conversation_id",msg.conversation_id).neq("user_id",uid()).maybeSingle();
              if(r.data?.user_id){setPage("messages");setTimeout(()=>openChat(r.data.user_id),80)}
            });
          }
          await refreshUnreadCounts();
        }
        if(currentPage==="messages" && !activeConversationId){pageRender().catch(()=>{});}
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"conversation_members"},payload=>{
        if(currentPage==="messages"){
          pageRender().catch(()=>{});
        }
      })
      .subscribe((status)=>{
        if(status==="SUBSCRIBED") {
          console.info("NEXORA Realtime connected");
          clearTimeout(realtimeRetryTimer);
        }
        if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
          console.warn("NEXORA Realtime unavailable:",status);
          clearTimeout(realtimeRetryTimer);
          realtimeRetryTimer=setTimeout(()=>loadRealtime(),2500);
        }
      });
  }catch(e){
    console.warn("Realtime setup skipped:",e);
    realtimeChannel = null;
  }
}
async function boot(){
  if(booting) return;
  booting = true;
  try{
    const s=await session();
    if(!s){authUI();return}
    window.__uid=s.user.id;
    try{
      window.__profile=await profile();
      await loadRelationshipState();
      await loadRealtime();
      await refreshUnreadCounts();
      await loadThemePreference();
      renderShell();
    }catch(err){
      document.getElementById("root").innerHTML=`<div class="wrap"><div class="card auth-card"><div class="logo">${brandLockup()}</div><h2>Setup error</h2><p class="muted">${esc(err.message)}</p><button class="primary" onclick="logout()">Back to login</button></div></div>`;
    }
  }finally{
    booting = false;
  }
}
boot();
</script>
